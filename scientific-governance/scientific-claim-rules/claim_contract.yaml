# TRUSTED SPECIFICATION — HUMAN-OWNED
# Only Gregory Way or Rey may modify this file.
# This is the formal contract that defines a valid claim.
# Corresponds to AlphaProof Code's "trusted specification" role.
# Any claim failing these rules is rejected regardless of who wrote it.

version: "2.0"
authority: "Gregory Way + Rey"
last_reviewed: "2026-11-27"

claim_types:
  molecular_function:
    description: "What a molecule does (enzyme activity, binding, localization)"
    min_evidence_strength: 2
    allowed_evidence_types:
      - biochemical_proof
      - preclinical_in_vitro
      - preclinical_in_vivo
      - systematic_review
      - computational
    required_related_node_labels: [Gene, Protein]

  pathway_interaction:
    description: "How molecules interact in a signaling pathway"
    min_evidence_strength: 2
    allowed_evidence_types:
      - biochemical_proof
      - preclinical_in_vitro
      - preclinical_in_vivo
      - systematic_review
    required_related_node_labels: [Pathway]

  clinical_outcome:
    description: "Treatment outcome, prognosis, or clinical phenotype"
    min_evidence_strength: 2
    required_fields: [source_year]
    allowed_evidence_types:
      - rct
      - cohort_study
      - case_report
      - systematic_review
    required_related_node_labels: [Disease]

  genetic_association:
    description: "Genotype-phenotype association or mutation effect"
    min_evidence_strength: 2
    allowed_evidence_types:
      - cohort_study
      - systematic_review
      - biochemical_proof
      - preclinical_in_vivo
    required_related_node_labels: [Phenotype]
    notes: >
      Gene nodes are sufficient for gene-level epidemiological claims
      (e.g. 'pathogenic NF1 variants occur in X% of patients').
      Mutation nodes (requiring hgvs_cdna) are reserved for specific
      variant-level claims. When ClinVar-derived claims arrive, revisit
      adding a GeneticVariantClass node type. See issue #35.

  drug_response:
    description: "Drug efficacy, mechanism, or resistance"
    min_evidence_strength: 2
    required_fields: [source_year]
    allowed_evidence_types:
      - rct
      - cohort_study
      - preclinical_in_vivo
      - preclinical_in_vitro
      - systematic_review
    required_related_node_labels: [Drug]

  phenotype_association:
    description: "Clinical features, frequency, or severity"
    min_evidence_strength: 1
    allowed_evidence_types:
      - cohort_study
      - case_report
      - systematic_review
      - expert_opinion
    required_related_node_labels: [Phenotype, Disease]

  model_validation:
    description: "Validity or utility of an NF1 model (cell line, mouse)"
    min_evidence_strength: 2
    allowed_evidence_types:
      - preclinical_in_vivo
      - preclinical_in_vitro
      - biochemical_proof
    required_related_node_labels: [CellLine]

global_rules:
  - claim_text must be a declarative, falsifiable statement
  - claim_text must not exceed 500 characters
  - at least one of source_pmid or source_doi must be present
  - extracted_by must be a registered agent or "human"
  - evidence_strength must be consistent with evidence_type (see evidence_rubric.yaml)
  - semantic_triple.predicate must be in allowed_predicates list (Biolink-validated)
  - if status is 'rejected' or 'refuted', rejection_class must be 'structural' or 'biological' (not null)
  - rejection_class structural = encoding problem, route back to Otto for re-grounding
  - rejection_class biological = biology wrong or unsupported, Kim writes to graph with status=refuted
  - pending claims must have pending_id set (8-char hex); claim_id must be null
  - accepted claims must have claim_id set (C#### pattern); pending_id should be null
  - rejected claims must have claim_id set (R#### pattern); pending_id should be null

# Allowed predicates for semantic_triple.predicate.
# Must match a key in edge_constraints.yaml edge_types (biological edges only).
# Validated at CI against Biolink Model Toolkit (bmt).
allowed_predicates:
  - ENCODES
  - ACTIVATES
  - INHIBITS
  - TREATS
  - IN_CLINICAL_TRIALS_FOR
  - BENEFICIAL_IN_MODELS_OF
  - TARGETS
  - CAUSES
  - GENE_ASSOCIATED_WITH_CONDITION
  - HAS_PHENOTYPE
  - PART_OF
  - HOMOLOGOUS_TO
  - FOUND_IN
