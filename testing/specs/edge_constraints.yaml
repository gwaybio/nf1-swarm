# TRUSTED SPECIFICATION — HUMAN-OWNED
# Only @gwaybio or Rey may modify this file.

version: "1.0"
authority: "Gregory Way (@gwaybio) + Rey"

edge_types:
  CAUSES:       {from: [Mutation], to: [Disease, Phenotype]}
  ENCODES:      {from: [Gene], to: [Protein]}
  ACTIVATES:    {from: [Protein], to: [Protein, Pathway]}
  INHIBITS:     {from: [Drug, Protein], to: [Protein, Pathway]}
  TREATS:       {from: [Drug], to: [Disease, Phenotype], required_properties: []}
  TARGETS:      {from: [Drug], to: [Gene, Protein]}
  ASSOCIATED_WITH: {from: [Gene, Mutation], to: [Phenotype, Disease]}
  GENE_ASSOCIATED_WITH_CONDITION: {from: [Gene, Mutation], to: [Phenotype, Disease], biolink_predicate: "biolink:gene_associated_with_condition"}
  HAS_PHENOTYPE: {from: [Disease], to: [Phenotype], biolink_predicate: "biolink:has_phenotype"}
  PART_OF:      {from: [Gene, Protein], to: [Pathway]}
  EXTRACTED_FROM: {from: [Claim], to: [Publication]}
  SUPPORTS:     {from: [Claim], to: [Claim]}
  CONTRADICTS:  {from: [Claim], to: [Claim]}
  VALIDATED_IN: {from: [Claim], to: [CellLine, AnimalModel]}
  FOUND_IN:     {from: [Gene, Dataset], to: [Dataset, Gene]}
  HOMOLOGOUS_TO: {from: [Protein, Gene], to: [Protein, Gene]}
  ABOUT:        {from: [Claim], to: [Gene, Protein, Pathway, Mutation, Phenotype, Disease, Drug, ClinicalTrial, CellLine, AnimalModel, Dataset]}

forbidden_patterns:
  - description: "Circular SUPPORTS edges not permitted"
    pattern: "(a:Claim)-[:SUPPORTS]->(b:Claim)-[:SUPPORTS]->(a)"
