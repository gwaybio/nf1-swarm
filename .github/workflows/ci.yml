name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate claims & schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ci-validate-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Validate pending claims
        run: uv run python testing/harness/claim_validator.py

      - name: Check claim table format
        run: |
          uv run python - << 'EOF'
          import csv, sys
          from pathlib import Path
          errors = []
          required_cols = {"claim_id", "claim_text", "claim_type",
                           "min_evidence_strength", "evidence_type", "expect_valid"}
          for f in Path("testing/acceptance/claim_tables").glob("*.csv"):
              rows = list(csv.DictReader(open(f)))
              missing = required_cols - set(rows[0].keys()) if rows else set()
              if missing:
                  errors.append(f"{f.name}: missing columns {missing}")
              else:
                  print(f"  OK  {f.name} ({len(rows)} rows)")
          if errors:
              for e in errors: print(f"FAIL {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Validate YAML specs (trusted TCB)
        run: |
          uv run python - << 'EOF'
          import yaml, sys
          from pathlib import Path
          errors = []
          for f in Path("testing/specs").glob("*.yaml"):
              try:
                  yaml.safe_load(f.read_text())
                  print(f"  OK  {f.name}")
              except yaml.YAMLError as e:
                  errors.append(f"{f.name}: {e}")
          if errors:
              for e in errors: print(f"FAIL {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Validate claims JSON schema
        run: |
          uv run python - << 'EOF'
          import json, jsonschema, sys
          from pathlib import Path
          schema = json.loads(Path("claims/schema.json").read_text())
          jsonschema.Draft7Validator.check_schema(schema)
          print("  OK  claims/schema.json is a valid JSON Schema")
          EOF

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"CI validate failed (claim_validator / schema check)\nRun: ${RUN_URL}\"}"

  graph-health:
    name: Graph assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-graph-${{ github.ref }}
      cancel-in-progress: true
    env:
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Read Neo4j version
        # .neo4j-version is the single source of truth for the server version.
        # services: image tags can't use env vars, so we start Neo4j manually.
        run: echo "NEO4J_VERSION=$(cat .neo4j-version)" >> "$GITHUB_ENV"

      - name: Cache Neo4j Docker image
        id: cache-neo4j
        uses: actions/cache@v4
        with:
          path: /tmp/neo4j-image.tar
          key: neo4j-${{ env.NEO4J_VERSION }}-community

      - name: Load or pull Neo4j image
        run: |
          if [ -f /tmp/neo4j-image.tar ]; then
            echo "Loading Neo4j image from cache..."
            docker load -i /tmp/neo4j-image.tar
          else
            echo "Pulling Neo4j image..."
            docker pull neo4j:${{ env.NEO4J_VERSION }}-community
            docker save neo4j:${{ env.NEO4J_VERSION }}-community -o /tmp/neo4j-image.tar
          fi

      - name: Start Neo4j
        run: |
          docker run -d --name neo4j \
            -p 7687:7687 -p 7474:7474 \
            -e NEO4J_AUTH=neo4j/${{ secrets.NEO4J_PASSWORD }} \
            -e NEO4J_PLUGINS='["apoc"]' \
            neo4j:${{ env.NEO4J_VERSION }}-community
          echo "Waiting for Neo4j..."
          for i in $(seq 1 30); do
            docker exec neo4j cypher-shell -u neo4j -p "${{ secrets.NEO4J_PASSWORD }}" "RETURN 1" 2>/dev/null && echo "ready" && break
            sleep 3
          done

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Bootstrap graph
        run: |
          uv run python knowledge_graph/seeds/bootstrap.py --password "${{ secrets.NEO4J_PASSWORD }}"
          uv run python -c "
          from neo4j import GraphDatabase
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','${{ secrets.NEO4J_PASSWORD }}'))
          with d.session() as s:
              s.run(\"MERGE (c:Counter {name: 'claim_id'}) ON CREATE SET c.value = 0\")
              s.run(\"MERGE (c:Counter {name: 'rejection_id'}) ON CREATE SET c.value = 0\")
          d.close()
          "

      - name: Verify reserve_claim_id (APOC)
        run: |
          uv run python -c "
          from neo4j import GraphDatabase
          from knowledge_graph.queries.reserve_claim_id import next_claim_id
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','${{ secrets.NEO4J_PASSWORD }}'))
          with d.session() as s:
              cid = next_claim_id(s)
              assert cid == 'C0001', f'expected C0001, got {cid}'
              cid2 = next_claim_id(s)
              assert cid2 == 'C0002', f'expected C0002, got {cid2}'
              s.run(\"MATCH (c:Counter {name: 'claim_id'}) SET c.value = 0\")
          d.close()
          print('reserve_claim_id end-to-end OK (apoc.lock.nodes succeeded)')
          "

      - name: Run graph assertions
        run: uv run python testing/harness/approval_checker.py

      - name: Run full test harness
        run: uv run python testing/harness/claim_validator.py && uv run python testing/harness/approval_checker.py

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"CI graph-health failed (approval_checker / graph assertions)\nRun: ${RUN_URL}\"}"
