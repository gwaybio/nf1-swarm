name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate claims & schema
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Validate pending claims
        run: uv run python testing/harness/claim_validator.py

      - name: Check claim table format
        run: |
          uv run python - << 'EOF'
          import csv, sys
          from pathlib import Path
          errors = []
          required_cols = {"claim_id", "claim_text", "claim_type",
                           "min_evidence_strength", "evidence_type", "expect_valid"}
          for f in Path("testing/acceptance/claim_tables").glob("*.csv"):
              rows = list(csv.DictReader(open(f)))
              missing = required_cols - set(rows[0].keys()) if rows else set()
              if missing:
                  errors.append(f"{f.name}: missing columns {missing}")
              else:
                  print(f"  OK  {f.name} ({len(rows)} rows)")
          if errors:
              for e in errors: print(f"FAIL {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Validate YAML specs (trusted TCB)
        run: |
          uv run python - << 'EOF'
          import yaml, sys
          from pathlib import Path
          errors = []
          for f in Path("testing/specs").glob("*.yaml"):
              try:
                  yaml.safe_load(f.read_text())
                  print(f"  OK  {f.name}")
              except yaml.YAMLError as e:
                  errors.append(f"{f.name}: {e}")
          if errors:
              for e in errors: print(f"FAIL {e}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Validate claims JSON schema
        run: |
          uv run python - << 'EOF'
          import json, jsonschema, sys
          from pathlib import Path
          schema = json.loads(Path("claims/schema.json").read_text())
          jsonschema.Draft7Validator.check_schema(schema)
          print("  OK  claims/schema.json is a valid JSON Schema")
          EOF

  graph-health:
    name: Graph assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Read Neo4j version
        # .neo4j-version is the single source of truth for the server version.
        # services: image tags can't use env vars, so we start Neo4j manually.
        run: echo "NEO4J_VERSION=$(cat .neo4j-version)" >> "$GITHUB_ENV"

      - name: Start Neo4j
        run: |
          docker run -d --name neo4j \
            -p 7687:7687 -p 7474:7474 \
            -e NEO4J_AUTH=neo4j/nf1swarm \
            -e NEO4J_PLUGINS='["apoc"]' \
            neo4j:${{ env.NEO4J_VERSION }}-community
          echo "Waiting for Neo4j..."
          for i in $(seq 1 30); do
            docker exec neo4j cypher-shell -u neo4j -p nf1swarm "RETURN 1" 2>/dev/null && echo "ready" && break
            sleep 3
          done

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Bootstrap graph
        run: |
          uv run python knowledge_graph/seeds/bootstrap.py --password nf1swarm
          uv run python -c "
          from neo4j import GraphDatabase
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','nf1swarm'))
          with d.session() as s:
              s.run(\"MERGE (c:Counter {name: 'claim_id'}) ON CREATE SET c.value = 0\")
          d.close()
          "

      - name: Verify reserve_claim_id (APOC)
        run: |
          uv run python -c "
          from neo4j import GraphDatabase
          from knowledge_graph.queries.reserve_claim_id import next_claim_id
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','nf1swarm'))
          with d.session() as s:
              cid = next_claim_id(s)
              assert cid == 'C0001', f'expected C0001, got {cid}'
              cid2 = next_claim_id(s)
              assert cid2 == 'C0002', f'expected C0002, got {cid2}'
              s.run(\"MATCH (c:Counter {name: 'claim_id'}) SET c.value = 0\")
          d.close()
          print('reserve_claim_id end-to-end OK (apoc.lock.nodes succeeded)')
          "

      - name: Run graph assertions
        run: uv run python testing/harness/approval_checker.py

      - name: Run full test harness
        run: uv run python testing/harness/claim_validator.py && uv run python testing/harness/approval_checker.py
