name: Daily Graph Health

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

jobs:
  health:
    name: Knowledge graph health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - name: Read Neo4j version
        run: echo "NEO4J_VERSION=$(cat .neo4j-version)" >> "$GITHUB_ENV"

      - name: Start Neo4j
        run: |
          docker run -d --name neo4j \
            -p 7687:7687 -p 7474:7474 \
            -e NEO4J_AUTH=neo4j/${{ secrets.NEO4J_PASSWORD }} \
            -e NEO4J_PLUGINS='["apoc"]' \
            neo4j:${{ env.NEO4J_VERSION }}-community
          echo "Waiting for Neo4j..."
          for i in $(seq 1 30); do
            docker exec neo4j cypher-shell -u neo4j -p "${{ secrets.NEO4J_PASSWORD }}" "RETURN 1" 2>/dev/null && echo "ready" && break
            sleep 3
          done

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Bootstrap
        run: |
          uv run python knowledge_graph/seeds/bootstrap.py --password "${{ secrets.NEO4J_PASSWORD }}"
          uv run python -c "
          from neo4j import GraphDatabase
          d = GraphDatabase.driver('bolt://localhost:7687', auth=('neo4j','${{ secrets.NEO4J_PASSWORD }}'))
          with d.session() as s:
              s.run(\"MERGE (c:Counter {name: 'claim_id'}) ON CREATE SET c.value = 0\")
              s.run(\"MERGE (c:Counter {name: 'rejection_id'}) ON CREATE SET c.value = 0\")
          d.close()
          "

      - name: Full health check
        id: health
        run: |
          uv run python scientific-governance/claim-validation-scripts/approval_checker.py

          set +e
          uv run python scientific-governance/claim-validation-scripts/claim_validator.py | tee /tmp/pending_validation.log
          pending_rc=${PIPESTATUS[0]}
          uv run python scripts/validate_accepted_claims.py | tee /tmp/accepted_validation.log
          accepted_rc=${PIPESTATUS[0]}
          set -e

          echo "claim_count=$(find claims/accepted -name '*.json' | wc -l)" >> $GITHUB_OUTPUT
          echo "pending_count=$(find claims/pending -name '*.json' | wc -l)" >> $GITHUB_OUTPUT
          echo "pending_validation=$(tail -1 /tmp/pending_validation.log)" >> $GITHUB_OUTPUT
          echo "accepted_validation=$(tail -1 /tmp/accepted_validation.log)" >> $GITHUB_OUTPUT

          if [ "$pending_rc" -ne 0 ] || [ "$accepted_rc" -ne 0 ]; then
            echo "Claim validation failed (pending_rc=$pending_rc, accepted_rc=$accepted_rc)"
            exit 1
          fi

      - name: Post health summary
        if: always()
        run: |
          echo "## Daily Health Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Neo4j version | $(cat .neo4j-version) |" >> $GITHUB_STEP_SUMMARY
          echo "| Accepted claims | ${{ steps.health.outputs.claim_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending claims | ${{ steps.health.outputs.pending_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending claim validation | ${{ steps.health.outputs.pending_validation }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Accepted claim validation | ${{ steps.health.outputs.accepted_validation }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
