name: Nightly Memory Consolidation (Milo Dream)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  dream:
    name: Milo offline consolidation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run dreaming pass
        run: uv run python swarm_memory/milo_dream.py

      - name: Commit updated memory store
        run: |
          git config user.name "Milo (nf1-swarm)"
          git config user.email "milo@nf1-swarm.bot"
          # Milo writes only to swarm_memory/ — never touches feature branch files.
          # Push to a dedicated milo/dream branch, then fast-forward merge to main.
          # This prevents Milo from competing with Emily or other agents on main.
          BRANCH="milo/dream-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add swarm_memory/
          git diff --cached --quiet && echo "No changes to commit" && git checkout main && exit 0
          git commit -m "chore(milo): nightly dream consolidation $(date -u +%Y-%m-%d)

          Co-authored-by: Gregory Way <gregory.way@gmail.com>"
          git push origin "$BRANCH"
          # Fast-forward main — safe because swarm_memory/ is Milo-only
          git checkout main
          git merge --ff-only "$BRANCH"
          git push origin main
          git push origin --delete "$BRANCH"

      - name: Post dream summary
        if: always()
        run: |
          echo "## Milo Dream Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Accepted claims | $(find claims/accepted -name '*.json' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Pending claims | $(find claims/pending -name '*.json' | wc -l) |" >> $GITHUB_STEP_SUMMARY
          echo "| Episodes | $(find swarm_memory/episodes -name '*.md' 2>/dev/null | wc -l) |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\": \"Nightly dream (Milo) failed — memory consolidation broken\nRun: ${RUN_URL}\"}"
