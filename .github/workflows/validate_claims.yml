name: Validate Claims

on:
  push:
    paths: ['claims/pending/**', 'testing/acceptance/**']
  pull_request:
    paths: ['claims/**', 'testing/**', 'knowledge_graph/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install jsonschema pyyaml
      - name: Validate pending claims
        run: python3 testing/harness/claim_validator.py
