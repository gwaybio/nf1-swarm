name: "⚙️ Engineering: Emily"
description: "Assign Emily to fix infrastructure, tooling, CI, database, or code issues."
title: "[EMILY] "
labels: ["engineering", "emily", "pending"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Bootstrap / seeds / Cypher
        - CI/CD workflows
        - Neo4j / database
        - Python tooling (fetcher, extractor, validator)
        - Testing harness (non-spec code only)
        - Dependencies / environment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What is broken or needs building? Include error messages, CI run URLs, or file paths."
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis (from Graude)
      description: "What Graude believes the root cause is. Emily should verify before acting."
      placeholder: "e.g. bootstrap.py splitter drops first statement when seed file starts with comments. See run #44143064017."

  - type: input
    id: directed_by
    attributes:
      label: Directed by
      placeholder: "@graude"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Emily checklist
      options:
        - label: Reproduce the failure locally or confirm via CI logs
        - label: Fix root cause (not just symptoms)
        - label: Run affected tests locally before pushing
        - label: "If touching scientific-governance/claim-validation-harness/ or scientific-governance/scientific-claim-rules/: open a PR, do NOT push directly to main"
        - label: "Commit with message: fix(<area>): <description>"
        - label: Comment on this issue with what was changed and why
        - label: Confirm CI is green after fix
