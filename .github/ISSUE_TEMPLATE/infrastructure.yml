name: "⚙️ Infrastructure / Code"
description: "Code, tooling, CI, database, or process improvements."
title: "[INFRA] "
labels: ["infrastructure"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CI/CD
        - Neo4j / database
        - Testing framework
        - Agent tooling
        - Dependencies
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution (optional)
