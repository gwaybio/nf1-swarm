name: "🧠 Memory: Milo Task"
description: "Assign Milo to a memory, context, or performance monitoring task."
title: "[MILO] "
labels: ["memory", "milo", "pending"]
body:
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - Retrieve episodic memory
        - Update registry entry
        - Trigger dream consolidation
        - Performance analysis
        - Context health check
        - Pruning review
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What does Milo need to do or retrieve?"
    validations:
      required: true

  - type: input
    id: directed_by
    attributes:
      label: Directed by
      placeholder: "@graude"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Milo checklist
      options:
        - label: Query git log first (primary episodic store)
        - label: Check swarm_memory/episodes/ second
        - label: Check GitHub issues third if needed
        - label: Return compact structured answer (no noise)
        - label: Update registry.md if agent status changed
        - label: Log any pruning decisions to pruning_log.md before acting
