version: 2
updates:
  # Python dependencies — ALL updates in one PR per week, never more
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    labels: ["infrastructure", "dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      all-python:
        patterns: ["*"]

  # GitHub Actions — ALL action updates in one PR per week
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    labels: ["infrastructure", "dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      all-actions:
        patterns: ["*"]
