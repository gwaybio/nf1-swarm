[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "nf1-swarm"
version = "0.1.0"
description = "Agentic AI swarm for NF1 biology knowledge graph compilation"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "biopython>=1.88",
    "idutils>=1.7.2",
    "bmt>=1.0.0",          # Biolink Model Toolkit — validates edge biolink_predicate values
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
literature = [
    # marker-pdf brings PyTorch + transformers (~4GB on first install).
    # Required only on machines running Dirk's PDF/HTML extraction workflow.
    # text_cleaner.py checks for this at runtime and prints a clear install message.
    # Install: uv sync --extra literature
    "marker-pdf>=2.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]

[tool.pytest.ini_options]
testpaths = ["scientific-governance"]
